name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: marketing_engine
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: migrator_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and Format Check (Ruff)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type Check (Mypy)
        run: |
          mypy src/

      - name: Apply Migrations & Seed
        env:
          DATABASE_URL: postgresql://migrator:migrator_secret@localhost:5432/marketing_engine
          APP_ROLE_URL: postgresql://app_user:app_secret@localhost:5432/marketing_engine
          LEARNING_ROLE_URL: postgresql://learning_svc:learning_secret@localhost:5432/marketing_engine
          PII_ENCRYPTION_KEY: vS8zC8rVl71Dk6fQWk3Xz9J2gN7tVb6uY4eO1pP8lDs=
          TENANT_HMAC_MASTER_KEY: kL9mB7xP2wQ4vC8nZ1tY6rJ3gH5eD0fA=
        run: |
          # This CI database is disposable. Provision test-only roles explicitly;
          # production credentials and role management remain an operator concern.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_user') THEN
              EXECUTE 'CREATE ROLE app_user LOGIN PASSWORD ''app_secret''';
            ELSE
              EXECUTE 'ALTER ROLE app_user WITH LOGIN PASSWORD ''app_secret''';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'learning_svc') THEN
              EXECUTE 'CREATE ROLE learning_svc LOGIN PASSWORD ''learning_secret'' BYPASSRLS';
            ELSE
              EXECUTE 'ALTER ROLE learning_svc WITH LOGIN PASSWORD ''learning_secret'' BYPASSRLS';
            END IF;
          END $;
          GRANT CONNECT ON DATABASE marketing_engine TO app_user, learning_svc;
          GRANT USAGE ON SCHEMA public TO app_user, learning_svc;
          SQL

          alembic upgrade head

          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_user;
          GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO app_user;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO app_user;
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE priors TO learning_svc;
          SQL

          python scripts/seed.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://migrator:migrator_secret@localhost:5432/marketing_engine
          APP_ROLE_URL: postgresql://app_user:app_secret@localhost:5432/marketing_engine
          LEARNING_ROLE_URL: postgresql://learning_svc:learning_secret@localhost:5432/marketing_engine
          PII_ENCRYPTION_KEY: vS8zC8rVl71Dk6fQWk3Xz9J2gN7tVb6uY4eO1pP8lDs=
          TENANT_HMAC_MASTER_KEY: kL9mB7xP2wQ4vC8nZ1tY6rJ3gH5eD0fA=
          DRY_RUN: "true"
          LIVE_SENDS: "false"
        run: |
          pytest tests/ -v
