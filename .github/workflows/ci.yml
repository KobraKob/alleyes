name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: marketing_engine
          POSTGRES_USER: migrator
          POSTGRES_PASSWORD: migrator_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint and Format Check (Ruff)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Type Check (Mypy)
        run: |
          mypy src/

      - name: Apply Migrations & Seed
        env:
          DATABASE_URL: postgresql://migrator:migrator_secret@localhost:5432/marketing_engine
          APP_ROLE_URL: postgresql://app_user:app_secret@localhost:5432/marketing_engine
          LEARNING_ROLE_URL: postgresql://learning_svc:learning_secret@localhost:5432/marketing_engine
          PII_ENCRYPTION_KEY: vS8zC8rVl71Dk6fQWk3Xz9J2gN7tVb6uY4eO1pP8lDs=
          TENANT_HMAC_MASTER_KEY: kL9mB7xP2wQ4vC8nZ1tY6rJ3gH5eD0fA=
        run: |
          python scripts/seed.py

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://migrator:migrator_secret@localhost:5432/marketing_engine
          APP_ROLE_URL: postgresql://app_user:app_secret@localhost:5432/marketing_engine
          LEARNING_ROLE_URL: postgresql://learning_svc:learning_secret@localhost:5432/marketing_engine
          PII_ENCRYPTION_KEY: vS8zC8rVl71Dk6fQWk3Xz9J2gN7tVb6uY4eO1pP8lDs=
          TENANT_HMAC_MASTER_KEY: kL9mB7xP2wQ4vC8nZ1tY6rJ3gH5eD0fA=
          DRY_RUN: "true"
          LIVE_SENDS: "false"
        run: |
          pytest tests/ -v
